# PanelReady: rebuild the state pages whenever CMS posts a new weekly NPPES file.
#
# Put this file in the repository at  .github/workflows/weekly.yml  (GitHub -> Add file -> Create new file,
# type that path as the name, paste this, Commit). It runs every 3 hours (at :07); build_pages.py downloads
# a weekly file only when there is one it hasn't seen, so most runs finish in seconds and change nothing.
# It also checks the PanelReady PC is running (last step). Every 3 hours rather than once a day because CMS's download site goes down for maintenance for days at a time and
# comes back for only a few hours; the PanelReady PC also publishes the pages it builds (publish_site.py), so
# whichever sees the new file first updates the site. Public repository, so the runs cost nothing.
# "Run workflow" under the Actions tab runs it by hand. Needs nothing else: no secrets, no keys.
# The sample spreadsheet is written as the branded .xlsx when pr/workbook.py, pr/boost.py and the logo images
# (pr/logo_lockup.png, pr/logo_print.png) are in the repository and XlsxWriter is installed (the step below);
# otherwise the plain CSV sample stays the download.
# Python's cache files are switched off (PYTHONDONTWRITEBYTECODE): until Nov 3, 2026 each run wrote fresh ones into
# pr/__pycache__ and committed them, so every run made a commit and redeployed the site even with nothing new.
# A weekly file CMS lists but won't hand over yet (or CMS being down) is not an error: the run says so and the next
# run tries again (build_pages.py), so it doesn't email a failure every 3 hours while CMS catches up.
name: Weekly state pages

on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the spreadsheet writer (the branded sample spreadsheet)
        run: pip install "XlsxWriter>=3.2,<4"

      - name: Fetch new weekly files and rebuild the pages
        run: python build_pages.py --fetch

      - name: Commit the pages (only if something changed)
        run: |
          git config user.name "panelready-pages"
          git config user.email "panelready-pages@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new weekly file; nothing to publish."
          else
            git commit -m "State pages for the week ending $(python -c "import json;print(json.load(open('data/weeks.json'))['latest'])")"
            git push || echo "Not pushed: the PanelReady PC published at the same moment; the next run picks up from there."
          fi

      # The PanelReady PC sends the customers' lists, so it must be on. Its morning run updates data/pc_heartbeat.json
      # (publish_site.py --heartbeat). If that's 30+ hours old, this step fails once a day, and GitHub emails the
      # account that owns this repository ("Run failed: Weekly state pages"): the PC is off, asleep or offline.
      - name: Check the PanelReady PC has run today
        run: |
          python - <<'EOF'
          import datetime as dt, json, pathlib, sys
          p = pathlib.Path("data/pc_heartbeat.json")
          if not p.exists():
              print("No PC heartbeat yet."); sys.exit(0)
          last = dt.datetime.fromisoformat(json.loads(p.read_text())["last_run"])
          hours = (dt.datetime.now(dt.timezone.utc) - last).total_seconds() / 3600
          print(f"The PanelReady PC last ran its morning job {hours:.0f} hours ago ({last:%a %b %d %H:%M} UTC).")
          if hours >= 30 and (hours - 30) % 24 < 3:
              print("::error::The PanelReady PC hasn't run its morning job for over a day: customers' lists and replies "
                    "wait until it's back on. Check that the PC is on, awake and online.")
              sys.exit(1)
          EOF
